<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    
     <!--CONTACTO-->
    <section id="contacto">

        <h2>Contacto</h2>

        <!--IMAGEN-->
        <img src="img/Trabajando 20.jpeg" alt="Modista trabajando">

        <p>Puedes comunicarte con nosotras para realizar pedidos o resolver dudas.</p>

        <!--FORMULARIO-->
        <form>

            <!--NOMBRE-->
            <input type="text" placeholder="Tu nombre">

            <!--CORREO-->
            <input type="email" placeholder="Tu correo">

            <!--TIPO DE VESTIDO-->
            <label>Tipo de Vestido:</label>

            <!--OPCIONES DE VESTIDOS-->
            <select>
                <option>Vestido de Graduación</option>
                <option>Vestido Casual</option>
                <option>Vestido Elegante</option>
                <option>Vestido de Fiesta</option>
                <option>Vestidos de Bodas</option>
                <option>Vestidos de Quince años</option>
                <option>Vestidos de Seciones Fotográficas</option>
                <option>Vestidos de Eventos Escolares</option>
            </select>

            <br><br>

            <!--DECORACIONES-->
            <h3>Decoraciones</h3>

            <input type="checkbox"> Bordados <br>
            <input type="checkbox"> Encajes <br>
            <input type="checkbox"> Perlas <br>
            <input type="checkbox"> Piedras <br><br>

            <!--COLOR-->
            <label>Color:</label>

            <select>
                <option>Rosado</option>
                <option>Negro</option>
                <option>Blanco</option>
                <option>Rojo</option>
                <option>MUCHAS MAS A TU PREFERENCIA</option>
            </select>

            <br><br>

            <!--MENSAJE-->
            <textarea placeholder="Describe cómo quieres tu Vestido"></textarea>

            <br><br>

            <!--BOTON-->
           <a href="agradecimiento.html" class="boton-enviar">
                Enviar Pedido
                </a>
        </form>

         <!--CALIFICACION DE UN BUEN TRABAJO-->
        <div class="evaluacion">
            <input value="5" name="rate" id="estrela5" type="radio">
            <label title="text" for="estrela5"></label>
            <input value="4" name="rate" id="estrela4" type="radio">
            <label title="text" for="estrela4"></label>
            <input value="3" name="rate" id="estrela3" type="radio">
            <label title="text" for="estrela3"></label>
            <input value="2" name="rate" id="estrela2" type="radio">
            <label title="text" for="estrela2"></label>
            <input value="1" name="rate" id="estrela1" type="radio">
            <label title="text" for="estrela1"></label>
        </div>

        <!--AGRADECIMIENTO-->
        <p class="gracias">¡Será un placer crear el vestido de tus Sueños, Gracias por confiar en Sueños en Tela!</p>
        <img src="img/Gracias 21.jpeg" alt="Muchas gracias">
    </section>
 
        <a href="pagina.html">volver al inicio</a>

</body>
</html>
