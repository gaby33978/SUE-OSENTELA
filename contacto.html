<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    
     <!--CONTACTO-->
    <section id="contacto">
        <a href="pagina.html">volver al inicio</a>
        <h2>Contacto</h2>

        <!--IMAGEN-->
        <img src="img/Trabajando 20.jpeg" alt="Modista trabajando">

        <p>Puedes comunicarte con nosotras para realizar pedidos o resolver dudas.</p>

        <!--FORMULARIO-->
        <form>

            <!--NOMBRE-->
            <input type="text" placeholder="Tu nombre">

            <!--CORREO-->
            <input type="email" placeholder="Tu correo">

            <!--TIPO DE VESTIDO-->
            <label>Tipo de Vestido:</label>

            <!--OPCIONES DE VESTIDOS-->
            <select>
                <option>Vestido de Graduación</option>
                <option>Vestido Casual</option>
                <option>Vestido Elegante</option>
                <option>Vestido de Fiesta</option>
                <option>Vestidos de Bodas</option>
                <option>Vestidos de Quince años</option>
                <option>Vestido de Seciones Fotográficas</option>
                <option>Vestido de Eventos Escolares</option>
                <option>Vestido de Gala</option>
                <option>Vestido Moderno</option>
                <option>Vestido Princesa</option>
                <option>Vestido Ajustado</option>
                <option>Vestido Largo</option>
                <option>Vestido Corto</option>
                <option>Vestido con Brillos</option>
                <option>Vestido con Encajes</option>
                <option>Vestido Floral</option>
                <option>Vestido Vintage</option>
                <option>Vestido de Noche</option>
                <option>Vestido Juvenil</option>
                <option>Vestido Formal</option>
                <option>Vestido Romántico</option>
                <option>Vestido Personalizado</option>
            </select>

            <br><br>

            <!--DECORACIONES-->
            <h3 class="titulo-decoraciones">Decoraciones</h3>
            
            <div class="decoraciones">
                <label><input type="checkbox"> Bordados</label>
                <label><input type="checkbox"> Encajes</label>
                <label><input type="checkbox"> Perlas</label>
                <label><input type="checkbox"> Piedras</label>
                <label><input type="checkbox"> Lentejuelas</label>
                <label><input type="checkbox"> Moñas</label>
                <label><input type="checkbox"> Flores Decorativas</label>
                <label><input type="checkbox"> Brillos</label>
                <label><input type="checkbox"> Transparencias</label>
                <label><input type="checkbox"> Pedrería</label>
                <label><input type="checkbox"> Mangas Elegantes</label>
                <label><input type="checkbox"> Cola Larga</label>
                <label><input type="checkbox"> Personalizados</label>
            </div>

            <!--COLOR-->
            <div class="color-vestido">
                <label>Color:</label>
                
                <select>
                    <option>Rosado</option>
                    <option>Negro</option>
                    <option>Blanco</option>
                    <option>Rojo</option>
                    <option>Azul Martino</option>
                    <option>Dorado</option>
                    <option>Plateado</option>
                    <option>Lila</option>
                    <option>Celeste</option>
                    <option>Verde Esmeralda</option>
                    <option>Champagne</option>
                    <option>Vino</option>
                    <option>Morado</option>
                    <option>Fucsia</option>
                    <option>Beige</option>
                    <option>Turquesa</option>
                    <option>Personalizados</option>
                </select>
            </div>

            <!--MENSAJE-->
            <textarea placeholder="Describe cómo quieres tu Vestido"></textarea>

            <br><br>

            <!--BOTON-->
           <a href="agradecimiento.html" class="boton-enviar">
                Enviar Pedido
                </a>
        </form>

         <!--CALIFICACION DE UN BUEN TRABAJO-->
         
         <div class="evaluacion">
            <input type="radio" name="rate" id="estrella5">
            <label for="estrella5"></label>
            
            <input type="radio" name="rate" id="estrella4">
            <label for="estrella4"></label>

            <input type="radio" name="rate" id="estrella3">
            <label for="estrella3"></label>

            <input type="radio" name="rate" id="estrella2">
            <label for="estrella2"></label>

            <input type="radio" name="rate" id="estrella1">
            <label for="estrella1"></label>
        </div>

        <!--AGRADECIMIENTO-->
        <p class="gracias">¡Será un placer crear el vestido de tus Sueños, Gracias por confiar en Sueños en Tela!</p>
        <img src="img/Gracias 21.jpeg" alt="Muchas gracias">
    </section>
    
        <a href="index.html">volver al inicio</a>

</body>
</html>
